<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lettura Contatore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --blu:    #1a56a0;
            --blu-sc: #0f3870;
            --acqua:  #e8f4fd;
            --grigio: #6b7280;
            --bordo:  #d1dde8;
            --sfondo: #f5f8fb;
            --bianco: #ffffff;
            --verde:  #16a34a;
            --rosso:  #dc2626;
            --arancio: #d97706;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--sfondo);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 40px;
        }
        header {
            width: 100%;
            background: var(--blu);
            color: white;
            padding: 20px 24px 18px;
            text-align: center;
        }
        header h1 { font-size: 18px; font-weight: 600; }
        header p { font-size: 13px; opacity: 0.75; margin-top: 4px; }
        .card {
            background: var(--bianco);
            border: 1px solid var(--bordo);
            border-radius: 16px;
            padding: 24px;
            margin: 20px 16px 0;
            width: calc(100% - 32px);
            max-width: 440px;
        }
        .zona-foto {
            width: 100%;
            aspect-ratio: 4/3;
            border: 2px dashed var(--bordo);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--acqua);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .zona-foto:hover { border-color: var(--blu); }
        .zona-foto img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .zona-foto .placeholder {
            display: flex; flex-direction: column; align-items: center;
            gap: 10px; color: var(--grigio); padding: 20px; text-align: center;
        }
        .zona-foto .placeholder svg { opacity: 0.5; }
        .zona-foto .placeholder span { font-size: 14px; line-height: 1.4; }
        #input-foto { display: none; }
        .bottoni { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn {
            width: 100%; padding: 16px; border-radius: 10px; border: none;
            font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-foto { background: var(--acqua); color: var(--blu); border: 1.5px solid var(--blu); }
        .btn-foto:active { background: #d0e8f8; }
        .btn-invia { background: var(--blu); color: white; display: none; }
        .btn-invia:active { background: var(--blu-sc); }
        .btn-invia:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-invia.visibile { display: flex; }

        /* LOG TENTATIVI */
        .log-tentativi {
            display: none;
            margin-top: 16px;
            background: #f8fafc;
            border: 1px solid var(--bordo);
            border-radius: 10px;
            padding: 14px;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--grigio);
            line-height: 1.8;
        }
        .log-tentativi .log-titolo {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--grigio);
            margin-bottom: 8px;
        }
        .log-riga { display: flex; align-items: center; gap: 8px; }
        .log-riga .spinner-mini {
            width: 10px; height: 10px;
            border: 1.5px solid #cbd5e1;
            border-top-color: var(--blu);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        .log-riga.ok .spinner-mini { display: none; }
        .log-riga.ok::before { content: "✓"; color: var(--verde); font-weight: bold; }
        .log-riga.fail .spinner-mini { display: none; }
        .log-riga.fail::before { content: "✗"; color: var(--rosso); }

        /* RISULTATO */
        .risultato {
            display: none; margin-top: 20px; padding: 20px;
            border-radius: 12px; text-align: center;
        }
        .risultato.successo { background: #f0fdf4; border: 1.5px solid #86efac; }
        .risultato.errore { background: #fef2f2; border: 1.5px solid #fca5a5; }
        .risultato .etichetta {
            font-size: 12px; font-weight: 500; text-transform: uppercase;
            letter-spacing: 0.06em; color: var(--grigio); margin-bottom: 8px;
        }
        .risultato .numero {
            font-family: 'DM Mono', monospace; font-size: 44px;
            font-weight: 500; color: var(--verde); line-height: 1;
        }
        .risultato .unita { font-size: 14px; color: var(--grigio); margin-top: 6px; }
        .risultato .msg-errore { font-size: 14px; color: var(--rosso); line-height: 1.5; }
        .risultato .via { font-size: 11px; color: var(--grigio); margin-top: 10px; opacity: 0.7; }

        .spinner {
            width: 20px; height: 20px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top-color: white; border-radius: 50%;
            animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .istruzione { font-size: 13px; color: var(--grigio); margin-top: 16px; line-height: 1.5; text-align: center; }
    </style>
</head>
<body>
<header>
    <h1>Lettura Contatore Acqua</h1>
    <p>Scatta una foto al contatore per registrare la lettura</p>
</header>

<div class="card">
    <div class="zona-foto" id="zonaFoto" onclick="document.getElementById('input-foto').click()">
        <div class="placeholder" id="placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
            <span>Tocca per fotografare<br>il contatore</span>
        </div>
        <img id="anteprima" alt="Anteprima foto contatore">
    </div>

    <input type="file" id="input-foto" accept="image/*" capture="environment">

    <div class="bottoni">
        <button class="btn btn-foto" onclick="document.getElementById('input-foto').click()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
            Scatta / Scegli foto
        </button>
        <button class="btn btn-invia" id="btnInvia" onclick="invia()">
            <div class="spinner" id="spinner"></div>
            <span id="btnTesto">Leggi il contatore</span>
        </button>
    </div>

    <!-- LOG TENTATIVI -->
    <div class="log-tentativi" id="logTentativi">
        <div class="log-titolo">Analisi in corso...</div>
        <div id="logRighe"></div>
    </div>

    <!-- RISULTATO -->
    <div class="risultato" id="risultato">
        <div class="etichetta" id="risultatoEtichetta">Lettura rilevata</div>
        <div class="numero" id="numeroLetto"></div>
        <div class="unita" id="unitaLabel">m³</div>
        <div class="msg-errore" id="msgErrore"></div>
        <div class="via" id="viaLabel"></div>
    </div>

    <p class="istruzione">Assicurati che il display del contatore sia ben visibile e illuminato nella foto.</p>
</div>

<script>
    const inputFoto = document.getElementById('input-foto');
    const anteprima = document.getElementById('anteprima');
    const placeholder = document.getElementById('placeholder');
    const btnInvia = document.getElementById('btnInvia');
    const risultato = document.getElementById('risultato');
    const numeroLetto = document.getElementById('numeroLetto');
    const msgErrore = document.getElementById('msgErrore');
    const spinner = document.getElementById('spinner');
    const btnTesto = document.getElementById('btnTesto');
    const logTentativi = document.getElementById('logTentativi');
    const logRighe = document.getElementById('logRighe');

    // Stessi valori di app.py — usati solo per mostrare il log in tempo reale
    const KEYS = ['account_1', 'account_2'];
    const MODELLI = ['gemini-3.5-flash', 'gemini-3.5-flash-lite', 'gemini-3.6-flash', 'gemini-3.7-flash'];

    let fotoSelezionata = null;
    let logInterval = null;
    let logStep = 0;

    inputFoto.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        fotoSelezionata = file;
        const reader = new FileReader();
        reader.onload = e => {
            anteprima.src = e.target.result;
            anteprima.style.display = 'block';
            placeholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
        btnInvia.classList.add('visibile');
        risultato.style.display = 'none';
        logTentativi.style.display = 'none';
        logRighe.innerHTML = '';
    });

    function avviaLogAnimato() {
        logTentativi.style.display = 'block';
        logRighe.innerHTML = '';
        logStep = 0;

        const sequenza = [];
        for (const key of KEYS) {
            for (const modello of MODELLI) {
                sequenza.push(`${key} / ${modello}`);
            }
        }

        // Aggiunge una riga ogni 1.8 secondi per simulare i tentativi
        logInterval = setInterval(() => {
            if (logStep >= sequenza.length) {
                clearInterval(logInterval);
                return;
            }
            const riga = document.createElement('div');
            riga.className = 'log-riga';
            riga.innerHTML = `<div class="spinner-mini"></div><span>${sequenza[logStep]}</span>`;
            riga.id = `log-${logStep}`;
            logRighe.appendChild(riga);
            logStep++;
        }, 1800);
    }

    function fermaLog(tentativi, tentatativoRiuscito) {
        clearInterval(logInterval);
        // Marca tutte le righe già aggiunte
        const righe = logRighe.querySelectorAll('.log-riga');
        righe.forEach(r => {
            const testo = r.querySelector('span')?.textContent;
            if (testo === tentatativoRiuscito) {
                r.className = 'log-riga ok';
            } else {
                r.className = 'log-riga fail';
            }
        });
    }

    async function invia() {
        if (!fotoSelezionata) return;

        btnInvia.disabled = true;
        spinner.style.display = 'block';
        btnTesto.textContent = 'Analisi in corso...';
        risultato.style.display = 'none';

        avviaLogAnimato();

        const formData = new FormData();
        formData.append('foto', fotoSelezionata);

        try {
            const res = await fetch('/analizza', { method: 'POST', body: formData });
            const data = await res.json();

            fermaLog(data.tentativi || [], data.tentativo_riuscito || '');

            risultato.style.display = 'block';

            if (data.lettura) {
                risultato.className = 'risultato successo';
                numeroLetto.style.display = 'block';
                numeroLetto.textContent = data.lettura;
                document.getElementById('unitaLabel').style.display = 'block';
                msgErrore.style.display = 'none';
                document.getElementById('risultatoEtichetta').textContent = 'Lettura rilevata';
                document.getElementById('viaLabel').textContent = data.tentativo_riuscito ? `via ${data.tentativo_riuscito}` : '';
            } else {
                risultato.className = 'risultato errore';
                numeroLetto.style.display = 'none';
                document.getElementById('unitaLabel').style.display = 'none';
                msgErrore.style.display = 'block';
                msgErrore.textContent = data.errore || 'Errore sconosciuto. Riprova.';
                document.getElementById('risultatoEtichetta').textContent = 'Attenzione';
                document.getElementById('viaLabel').textContent = '';
            }

        } catch (err) {
            fermaLog([], '');
            risultato.style.display = 'block';
            risultato.className = 'risultato errore';
            numeroLetto.style.display = 'none';
            document.getElementById('unitaLabel').style.display = 'none';
            msgErrore.style.display = 'block';
            msgErrore.textContent = 'Errore di connessione. Controlla la rete e riprova.';
            document.getElementById('risultatoEtichetta').textContent = 'Attenzione';
        } finally {
            btnInvia.disabled = false;
            spinner.style.display = 'none';
            btnTesto.textContent = 'Leggi il contatore';
        }
    }
</script>
</body>
</html>
